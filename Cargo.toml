[package]
name = "margin"
version = "0.3.0"
edition = "2024"
description = "Scoped draft preservation and review for Markdown writing projects"
license = "Apache-2.0"
repository = "https://github.com/nibzard/margin"
# SPEC 13.4 makes the standard-library file lock part of the toolchain
# decision: the shared mutation lock needs `std::fs::File::try_lock`,
# stabilized in Rust 1.89.0, so the declared minimum follows it. The pinned
# toolchain of `rust-toolchain.toml` stays the build compiler.
rust-version = "1.89.0"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
# `bracketed-paste` is the one feature beyond `events` the surface needs:
# text entry must receive one paste as literal text, never as a sequence
# of global actions (SPEC 11.3).
crossterm = { version = "=0.29.0", default-features = false, features = [
    "events",
    "bracketed-paste",
] }
unicode-width = "=0.2.2"
# Already shipped through ratatui; source editing uses its grapheme boundaries.
unicode-segmentation = "=1.13.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

# The seeded benchmark-corpus generator of SPEC 17.2 lives under bench/ but
# stays a development example target: `cargo run --example corpusgen` builds
# corpora; nothing here ships with the product executable.
[[example]]
name = "corpusgen"
path = "bench/corpus/main.rs"

# The process benchmark harness of SPEC 17.3-17.8 is a development
# example too: `cargo run --example benchrun` registers the runner,
# times fresh-process operations, and writes result records.
[[example]]
name = "benchrun"
path = "bench/perf/main.rs"
